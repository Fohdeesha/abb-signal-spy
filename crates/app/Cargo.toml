[package]
name = "abb-signal-spy"
description = "ABB Signal Spy: read, chart and record ABB IRC5 motion test signals over RobAPI InfoStream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "abb-signal-spy"
path = "src/main.rs"

[features]
default = ["dx12", "accessibility"]
dx12 = ["eframe/wgpu_no_default_features", "dep:wgpu"]
accessibility = ["eframe/accesskit"]

[dependencies]
signal-spy-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std", "parking_lot"], optional = true }
egui_plot = "0.37"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
signal-spy-core = { path = "../core", features = ["fake"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }
